name: Commercial license request
description: Ask about using y2e or its engine outside the AGPL terms
labels: [licensing]
body:
  - type: markdown
    attributes:
      value: |
        y2e is released under the AGPL-3.0-or-later. A separate commercial license is available, for example to include y2e or `y2e-core` in a closed-source product.

        Issues are public. Please do not put confidential details here: describe your use in general terms and the author will reply to agree on a private way to continue.
  - type: textarea
    id: use
    attributes:
      label: What you want to do with it
      description: The product or service, and how y2e or `y2e-core` would be part of it.
    validations:
      required: true
  - type: dropdown
    id: distribution
    attributes:
      label: How it would be delivered
      options:
        - Desktop application
        - Online service
        - Embedded in another product
        - Internal use in a company
        - Other
    validations:
      required: true
  - type: input
    id: who
    attributes:
      label: Who you are
      description: Your name or the name of your organisation, as you are happy to share it publicly.

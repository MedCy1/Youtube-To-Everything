name: Release

# Push a tag such as v0.2.0 (scripts/release.sh does it) to publish a release.
# Run it by hand from the Actions tab to rehearse: everything runs except the
# publication, and the archives are kept as build artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.name }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04 }
          - { name: macos-universal, os: macos-latest }
          - { name: windows-x86_64, os: windows-latest }
    defaults:
      run:
        shell: bash
    env:
      # Signing the macOS app needs the secrets below; without them it is only ad-hoc signed.
      HAVE_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev

      - name: The tag must match the crate version
        if: github.ref_type == 'tag'
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="y2e-gui"))')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml" >&2
            exit 1
          fi

      - name: Build
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            for target in aarch64-apple-darwin x86_64-apple-darwin; do
              cargo build --profile dist -p y2e-gui --locked --target "$target"
            done
            lipo -create -output y2e-gui target/aarch64-apple-darwin/dist/y2e-gui target/x86_64-apple-darwin/dist/y2e-gui
          else
            cargo build --profile dist -p y2e-gui --locked
          fi

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about${{ runner.os == 'Linux' && ',cargo-deb' || '' }}

      - name: Third-party licenses
        run: scripts/third-party.sh

      - name: Import the Apple signing certificate
        if: runner.os == 'macOS' && env.HAVE_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain"
          password=$(uuidgen)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Windows installer tool
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Package
        env:
          SIGN_IDENTITY: ${{ env.HAVE_APPLE_CERT == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          tag="$GITHUB_REF_NAME"
          mkdir out
          case "$RUNNER_OS" in
            Linux)
              name="y2e-$tag-linux-x86_64"
              mkdir "$name"
              cp target/dist/y2e-gui packaging/y2e.desktop packaging/y2e.svg packaging/install.sh README.md LICENSE THIRD-PARTY-LICENSES.txt "$name/"
              tar -czf "out/$name.tar.gz" "$name"
              cargo deb -p y2e-gui --profile dist --no-build -o "out/y2e-$tag-linux-amd64.deb"
              ;;
            macOS)
              packaging/macos/bundle.sh y2e-gui "$tag" "out/y2e-$tag-macos-universal.dmg" LICENSE THIRD-PARTY-LICENSES.txt
              ;;
            Windows)
              name="y2e-$tag-windows-x86_64"
              mkdir "$name"
              cp target/dist/y2e-gui.exe README.md LICENSE THIRD-PARTY-LICENSES.txt "$name/"
              powershell -NoProfile -Command "Compress-Archive -Path '$name' -DestinationPath 'out/$name.zip'"
              version="${tag#v}"
              [ "$version" = "$tag" ] && version=0.0.0
              # Git Bash would turn the /D options into file paths.
              MSYS2_ARG_CONV_EXCL="*" "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DVersion=$version" "/DOutName=$name-setup" packaging/windows/y2e.iss
              ;;
          esac
          cd out
          for f in *; do
            { sha256sum "$f" 2>/dev/null || shasum -a 256 "$f"; } > "$f.sha256"
          done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.name }}
          path: out/*

  publish:
    name: Publish
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release notes read the history between tags

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}

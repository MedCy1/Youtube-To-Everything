name: Release

# Push a tag such as v0.2.0 (scripts/release.sh does it) to publish a release.
# Run it by hand from the Actions tab to rehearse: everything runs except the
# publication, and the archives are kept as build artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.name }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04 }
          - { name: macos-universal, os: macos-latest }
          - { name: windows-x86_64, os: windows-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev

      - name: The tag must match the crate version
        if: github.ref_type == 'tag'
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="y2e-gui"))')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml" >&2
            exit 1
          fi

      - name: Build
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            for target in aarch64-apple-darwin x86_64-apple-darwin; do
              cargo build --profile dist -p y2e-gui --locked --target "$target"
            done
            lipo -create -output y2e-gui target/aarch64-apple-darwin/dist/y2e-gui target/x86_64-apple-darwin/dist/y2e-gui
          else
            cargo build --profile dist -p y2e-gui --locked
          fi

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Third-party licenses
        run: scripts/third-party.sh

      - name: Package
        run: |
          name="y2e-${GITHUB_REF_NAME}-${{ matrix.name }}"
          case "$RUNNER_OS" in
            Linux)
              mkdir "$name"
              cp target/dist/y2e-gui packaging/y2e.desktop packaging/y2e.svg packaging/install.sh README.md LICENSE THIRD-PARTY-LICENSES.txt "$name/"
              asset="$name.tar.gz"
              tar -czf "$asset" "$name"
              ;;
            macOS)
              asset="$name.zip"
              packaging/macos/bundle.sh y2e-gui "$GITHUB_REF_NAME" "$asset" LICENSE THIRD-PARTY-LICENSES.txt
              ;;
            Windows)
              mkdir "$name"
              cp target/dist/y2e-gui.exe README.md LICENSE THIRD-PARTY-LICENSES.txt "$name/"
              asset="$name.zip"
              powershell -NoProfile -Command "Compress-Archive -Path '$name' -DestinationPath '$asset'"
              ;;
          esac
          sha256sum "$asset" > "$asset.sha256" 2>/dev/null || shasum -a 256 "$asset" > "$asset.sha256"
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256

  publish:
    name: Publish
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release notes read the history between tags

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}

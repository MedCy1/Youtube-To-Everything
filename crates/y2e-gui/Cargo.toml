[package]
name = "y2e-gui"
version.workspace = true
edition = "2021"
description = "Native GPU Desktop UI for YouTube to Everything powered by Rune"
authors = ["Youtube to Everything Contributors"]

[dependencies]
y2e-core = { path = "../y2e-core" }
tokio = { version = "1.43", features = ["rt-multi-thread", "process"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "webp"] }

# Rune Native UI framework
rune = { git = "https://github.com/anomalyco/rune", default-features = false, features = ["embedded-fonts"] }
rune-kit = { git = "https://github.com/anomalyco/rune" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune" }
rune-fx = { git = "https://github.com/anomalyco/rune" }
wgpu = { version = "30", default-features = false }

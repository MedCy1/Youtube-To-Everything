[package]
name = "y2e-gui"
description = "Native GPU interface for YouTube to Everything, built with Rune"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
y2e-core = { path = "../y2e-core" }
tokio = { workspace = true, features = ["rt-multi-thread", "process"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "webp"] }
wgpu = { version = "30", default-features = false }

rune.workspace = true
rune-kit.workspace = true
rune-fx.workspace = true
rune-theme-opencode.workspace = true

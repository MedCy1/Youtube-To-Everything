[package]
name = "y2e-gui"
description = "Native GPU interface for YouTube to Everything, built with Rune"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
y2e-core = { path = "../y2e-core" }
tokio = { workspace = true, features = ["rt-multi-thread", "process"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "webp"] }
wgpu = { version = "30", default-features = false }
dirs = "6"

rune.workspace = true
rune-kit.workspace = true
rune-fx.workspace = true
rune-theme-opencode.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# The Debian package (cargo deb, built from the binary the release workflow made).
[package.metadata.deb]
name = "y2e"
maintainer = "MedCy1 <noreply@users.noreply.github.com>"
section = "video"
priority = "optional"
extended-description = "Paste a YouTube link, drag across the waveform to keep the part you want, and export it as MP4, MP3, a clip under 25 MB for Discord, or a GIF."
depends = "$auto"
recommends = "ffmpeg"
assets = [
    ["../../target/dist/y2e-gui", "usr/bin/", "755"],
    ["../../packaging/y2e.desktop", "usr/share/applications/", "644"],
    ["../../packaging/y2e.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../LICENSE", "usr/share/doc/y2e/", "644"],
    ["../../README.md", "usr/share/doc/y2e/", "644"],
]

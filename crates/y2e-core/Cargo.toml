[package]
name = "y2e-core"
version = "0.1.0"
edition = "2021"
description = "Core asynchronous download, inspection and transcoding engine for YouTube to Everything"
authors = ["Youtube to Everything Contributors"]

[dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
regex = "1.11"
tracing = "0.1"

[dev-dependencies]
tempfile = "3.17"

[package]
name = "y2e-core"
version.workspace = true
edition = "2021"
description = "Core asynchronous download, inspection and transcoding engine for YouTube to Everything"
authors = ["Youtube to Everything Contributors"]

[dependencies]
tokio = { version = "1.43", features = ["rt-multi-thread", "process", "io-util", "fs", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"


[dev-dependencies]
tokio = { version = "1.43", features = ["macros"] }

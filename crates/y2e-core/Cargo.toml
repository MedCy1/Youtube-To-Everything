[package]
name = "y2e-core"
description = "Download, cut and convert engine behind YouTube to Everything, with no UI dependency"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "process", "io-util", "fs", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
dirs = "6"
sha2 = "0.10"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "time"] }

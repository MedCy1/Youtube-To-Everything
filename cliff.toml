# Release notes and CHANGELOG from conventional commits (https://git-cliff.org).

[changelog]
header = "# Changelog\n\n"
body = """
{% if version %}## {{ version }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}## Unreleased
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}{{ commit.scope }}: {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} (**breaking change**){% endif %}
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
# The leading comment fixes the order of the sections; it is stripped when rendered.
commit_parsers = [
  # Added then reverted before any release: not worth a line in the notes.
  { message = "^perf\\(gui\\): hold the landing aurora still", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Internal" },
  { message = "^build|^ci", group = "<!-- 4 -->Build and CI" },
  { message = "^docs?", group = "<!-- 5 -->Documentation" },
  { message = "^revert|^style|^chore|^test", skip = true },
]

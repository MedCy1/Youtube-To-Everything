[workspace]
members = ["crates/y2e-core", "crates/y2e-gui"]
resolver = "2"

[workspace.package]
# The one place the version lives: scripts/release.sh bumps it.
version = "0.4.0"
edition = "2021"
authors = ["MedCy1"]
repository = "https://github.com/MedCy1/Youtube-To-Everything"
homepage = "https://github.com/MedCy1/Youtube-To-Everything"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
tokio = "1.43"

# Rune is pinned to a commit so a release builds the same everywhere.
rune = { git = "https://github.com/anomalyco/rune", rev = "09ab92a5", default-features = false, features = ["embedded-fonts", "accessibility", "metal-backend", "native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "09ab92a5" }
rune-fx = { git = "https://github.com/anomalyco/rune", rev = "09ab92a5" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "09ab92a5" }

# `cargo build --profile dist` is for shipping: slower to build, about 40% smaller.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true

# Rune builds against patched copies of these crates (macOS and Windows input,
# taskbar and shaping fixes), and a patch in a dependency's workspace does not
# carry over: an application has to repeat it, as Rune's own manifest says.
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "09ab92a5" }
winit = { git = "https://github.com/anomalyco/rune", rev = "09ab92a5" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "09ab92a5" }

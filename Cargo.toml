[workspace]
members = [
    "crates/y2e-core",
    "crates/y2e-gui",
]
resolver = "2"

[workspace.package]
# The one place the version lives: scripts/release.sh bumps it.
version = "0.1.0"

# `cargo build --profile dist` for shipping: slower to build, about 40% smaller.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true

# Settings for `cargo about`, which writes THIRD-PARTY-LICENSES.txt
# (see scripts/third-party.sh).

# What ships in the releases.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# The y2e crates are the project itself, not third-party code.
private = { ignore = true }

# Every license found among the dependencies has to be listed here. A new
# license makes the script fail, so it gets read before it is shipped.
accepted = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "BSL-1.0",
  "CC0-1.0",
  "0BSD",
  "OFL-1.1",
]
